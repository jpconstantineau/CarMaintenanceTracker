<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <script>
      try {
        const theme = localStorage.getItem('car-maintenance-tracker.theme');
        if (theme === 'light' || theme === 'dark') {
          document.querySelector('meta[name="color-scheme"]').content = theme;
        }
      } catch { /* The system theme remains available when storage is blocked. */ }
    </script>
    <title>Car Maintenance Tracker</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <header>
      <h1>Car Maintenance Tracker</h1>
      <div class="theme-control">
        <label for="theme">Theme</label>
        <select id="theme" name="theme">
          <option value="system">System</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
        <p id="theme-status" role="status"></p>
      </div>
    </header>
    <main>
      <div class="save-state">
        <p id="save-status" role="status">Opening local vehicles…</p>
        <p id="storage-error" role="alert"></p>
        <button id="retry" type="button" hidden>Retry local storage</button>
      </div>

      <section id="selection" aria-labelledby="selection-title" hidden>
        <h2 id="selection-title" tabindex="-1">Your vehicles</h2>
        <ul id="vehicle-list"></ul>
        <button id="add-vehicle" type="button">Add vehicle</button>
      </section>

      <section id="vehicle-summary" aria-labelledby="vehicle-title" hidden>
        <button id="all-vehicles" type="button" class="secondary">All vehicles</button>
        <h2 id="vehicle-title" tabindex="-1"></h2>
        <p id="vehicle-description"></p>
        <dl>
          <dt>Odometer units</dt><dd id="summary-units"></dd>
          <dt>Latest known mileage</dt><dd id="summary-mileage"></dd>
          <dt>Vehicle history</dt><dd id="summary-history"></dd>
          <dt>Notes</dt><dd id="summary-notes"></dd>
        </dl>
        <button id="edit-vehicle" type="button">Edit vehicle details</button>
      </section>

      <section id="vehicle-editor" aria-labelledby="editor-title" hidden>
        <h2 id="editor-title" tabindex="-1">Add vehicle</h2>
        <form id="vehicle-form" aria-labelledby="editor-title" novalidate>
          <fieldset id="editor-fields" aria-labelledby="editor-title">
            <div class="field">
              <label for="vehicle-name">Vehicle name (required)</label>
              <p id="name-hint" class="hint">A name you recognize, such as “Blue Civic”. Up to 100 characters.</p>
              <input id="vehicle-name" name="name" required maxlength="100" aria-describedby="name-hint" aria-invalid="false">
              <p id="name-error" class="field-error" hidden></p>
            </div>
            <fieldset class="units">
              <legend>Odometer units (required)</legend>
              <div class="choices">
                <div><input id="unit-km" name="odometerUnit" type="radio" value="km" required aria-invalid="false"><label for="unit-km">Kilometres (km)</label></div>
                <div><input id="unit-mi" name="odometerUnit" type="radio" value="mi" required aria-invalid="false"><label for="unit-mi">Miles (mi)</label></div>
              </div>
              <p id="odometerUnit-error" class="field-error" hidden></p>
            </fieldset>
            <div class="field">
              <label for="vehicle-make">Make (optional)</label>
              <input id="vehicle-make" name="make" maxlength="100" aria-invalid="false">
              <p id="make-error" class="field-error" hidden></p>
            </div>
            <div class="field">
              <label for="vehicle-model">Model (optional)</label>
              <input id="vehicle-model" name="model" maxlength="100" aria-invalid="false">
              <p id="model-error" class="field-error" hidden></p>
            </div>
            <div class="field">
              <label for="vehicle-year">Year (optional)</label>
              <input id="vehicle-year" name="year" inputmode="numeric" pattern="[0-9]{1,4}" maxlength="4" aria-invalid="false">
              <p id="year-error" class="field-error" hidden></p>
            </div>
            <div class="field">
              <label for="vehicle-notes">Notes (optional)</label>
              <textarea id="vehicle-notes" name="notes" rows="4" maxlength="5000" aria-invalid="false"></textarea>
              <p id="notes-error" class="field-error" hidden></p>
            </div>
            <div class="actions">
              <button id="submit-vehicle" type="submit">Create vehicle</button>
              <button id="cancel-edit" type="button" class="secondary">Cancel</button>
            </div>
          </fieldset>
          <p id="form-error" role="alert"></p>
        </form>
      </section>
      <noscript><p>JavaScript is needed to open and save your vehicles on this device.</p></noscript>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
